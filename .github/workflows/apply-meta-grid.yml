name: Apply meta grid redesign

on:
  push:
    branches:
      - 'ui/meta-grid-road-first'
    paths:
      - '.github/workflows/apply-meta-grid.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/meta-grid-road-first
          fetch-depth: 0

      - name: Recompose day meta grid
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, pattern, replacement, flags=0):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, got {count}')
              p.write_text(updated, encoding='utf-8')

          replace_once(
              'formatters.js',
              r"  function buildDayMeta\(day\) \{.*?\n  \}\n\n  function formatReservationWhen",
              '''  function buildDayMeta(day) {
            const items = [];

            const distanceKm = day.travelTotals?.distanceKm;
            const drivingMinutes = day.travelTotals?.drivingDurationMinutes;
            if (Number.isFinite(distanceKm) || Number.isFinite(drivingMinutes)) {
              let roadValue;
              if (distanceKm === 0 && drivingMinutes === 0) {
                roadValue = 'без машины';
              } else {
                const roadParts = [
                  Number.isFinite(distanceKm) ? formatDistance(distanceKm) : '',
                  Number.isFinite(drivingMinutes) ? formatDuration(drivingMinutes) : ''
                ].filter(Boolean);
                roadValue = roadParts.join(' · ');
                if (day.travelTotals?.approximate && roadValue) roadValue = `около ${roadValue}`;
              }
              if (roadValue) items.push({ label: 'Дорога', value: roadValue });
            }

            const departure = day.schedule?.departure?.start || null;
            const finish = day.schedule?.finish?.start || null;
            if (departure || finish) {
              const timeValue = departure && finish ? `${departure} → ${finish}` : departure || finish;
              items.push({ label: 'Время', value: timeValue });
            }

            if (day.swimming) items.push({ label: 'Купание', value: day.swimming });
            if (day.mealSummary) items.push({ label: 'Питание', value: day.mealSummary });

            const logistics = [];
            if (day.status !== 'confirmed') logistics.push(`Статус: ${statusLabel(day.status)}`);
            if (day.schedule?.carReturnDeadline) logistics.push(`Машину вернуть до ${day.schedule.carReturnDeadline}`);
            if (day.schedule?.flight) logistics.push(`Рейс ${day.schedule.flight.number} · ${day.schedule.flight.departureTime}`);
            if (logistics.length) items.push({ label: 'Логистика', value: logistics.join(' · ') });

            return items;
          }

          function formatReservationWhen''',
              flags=re.S
          )

          p = Path('app-runtime.js')
          text = p.read_text(encoding='utf-8')
          text, count = re.subn(
              r"const metaOrder = \[[^\n]+\];",
              "const metaOrder = ['дорога', 'время', 'купание', 'питание', 'логистика'];",
              text,
              count=1
          )
          if count != 1:
              raise SystemExit(f'app-runtime.js: metaOrder replacement count {count}')

          old_meta = """    const meta = orderedMeta.map((item,index) => `<div class=\"meta-item ${index < 4 ? 'primary' : 'secondary'}\"><span>${escapeHtml(item.label)}</span><strong>${escapeHtml(item.value)}</strong></div>`).join('');"""
          new_meta = """    const metaLayoutClass = new Map([
              ['дорога', 'meta-road'],
              ['время', 'meta-time'],
              ['купание', 'meta-swimming'],
              ['питание', 'meta-food'],
              ['логистика', 'meta-logistics']
            ]);
            const coreMetaLabels = new Set(['дорога', 'время', 'купание']);
            const meta = orderedMeta.map(item => {
              const label = normalizeLabel(item.label);
              const emphasisClass = coreMetaLabels.has(label) ? 'primary' : 'secondary';
              const layoutClass = metaLayoutClass.get(label) || 'meta-extra';
              return `<div class=\"meta-item ${emphasisClass} ${layoutClass}\"><span>${escapeHtml(item.label)}</span><strong>${escapeHtml(item.value)}</strong></div>`;
            }).join('');"""
          if old_meta not in text:
              raise SystemExit('app-runtime.js: meta renderer snippet not found')
          text = text.replace(old_meta, new_meta, 1)
          text, header_count = re.subn(r'<th>Км / В пути</th>', '<th>Дорога</th>', text, count=1)
          text, label_count = re.subn(r'data-label="Расстояние"', 'data-label="Дорога"', text, count=1)
          if header_count != 1 or label_count != 1:
              raise SystemExit(f'app-runtime.js: route labels changed header={header_count} data-label={label_count}')
          p.write_text(text, encoding='utf-8')

          replace_once(
              'styles.css',
              r"\.meta-grid \{ display:grid; grid-template-columns:repeat\(4,1fr\);.*?\.meta-item\.primary strong \{[^\n]+\}\n",
              '''.meta-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); width:100%; margin-bottom:12px; overflow:hidden; border:1px solid var(--line); border-radius:7px; background:var(--soft); }
          .meta-item { padding:5px 6px; border-bottom:1px solid var(--line); }
          .meta-item.primary { grid-column:span 1; }
          .meta-item.secondary { grid-column:1/-1; }
          .meta-road,.meta-time { border-right:1px solid var(--line); }
          .meta-swimming,.meta-food,.meta-logistics,.meta-extra { border-right:0; }
          .meta-food,.meta-logistics,.meta-extra { grid-column:1/-1; }
          .meta-item:last-child { border-bottom:0; }
          .meta-item span { display:block; color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
          .meta-item strong { display:block; margin-top:1px; font-size:13px; line-height:1.25; }
          .meta-item.primary strong { color:var(--accent-dark); font-size:14px; }
          ''',
              flags=re.S
          )

          replace_once(
              'styles.css',
              r"  \.meta-grid \{ display:grid; grid-template-columns:1fr 1fr; \}\n  \.meta-item,\.meta-item\.secondary \{.*?\n  \.meta-item:last-child \{ border-right:0; \}\n",
              '''  .meta-grid { display:grid; grid-template-columns:1fr 1fr; }
            .meta-item,.meta-item.secondary { display:block; border-top:0; border-bottom:1px solid var(--line); }
            .meta-item.primary { padding:4px 5px; }
            .meta-item.primary span { font-size:9px; }
            .meta-item.primary strong { margin-top:1px; font-size:13px; line-height:1.2; }
            .meta-road { grid-column:1; border-right:1px solid var(--line); }
            .meta-time { grid-column:2; border-right:0; }
            .meta-swimming,.meta-food,.meta-logistics,.meta-extra { grid-column:1/-1; border-right:0; }
            .meta-item:last-child { border-bottom:0; }
          ''',
              flags=re.S
          )

          replace_once(
              'styles.css',
              r"  \.meta-grid \{ display:table; margin-bottom:5px; \}\n  \.meta-item \{ display:table-cell; padding:4px; \}\n",
              '''  .meta-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-bottom:5px; }
            .meta-item { display:block; padding:4px; }
          '''
          )

          p = Path('service-worker.js')
          text = p.read_text(encoding='utf-8')
          match = re.search(r"const CACHE_VERSION = 'crete-2026-v(\d+)';", text)
          if not match:
              raise SystemExit('service-worker.js: cache version not found')
          next_version = int(match.group(1)) + 1
          text = text[:match.start()] + f"const CACHE_VERSION = 'crete-2026-v{next_version}';" + text[match.end():]
          p.write_text(text, encoding='utf-8')
          print(f'Bumped service worker cache to v{next_version}')
          PY

      - name: Validate
        run: |
          node --check formatters.js
          node --check app-runtime.js
          node scripts/validate-itinerary.mjs
          node scripts/check-runtime-contract.mjs
          node scripts/check-audio-source-contract.mjs
          node scripts/smoke-browser.mjs

      - name: Commit clean patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-meta-grid.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add formatters.js app-runtime.js styles.css service-worker.js .github/workflows/apply-meta-grid.yml
          git commit -m 'Recompose day meta grid'
          git push origin HEAD:ui/meta-grid-road-first
