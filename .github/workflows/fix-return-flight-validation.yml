name: Fix return flight validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-return-flight-validation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix Aug 22 visit duration contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, re
          from pathlib import Path

          path = Path('itinerary-data.js')
          text = path.read_text(encoding='utf-8')
          m = re.search(r'window\.CRETE_DATA = deepFreeze\((\{.*\})\);\s*\}\)\(\);\s*$', text, re.S)
          if not m:
              raise SystemExit('CRETE_DATA payload not found')
          data = json.loads(m.group(1))

          her = data['visits']['2026-08-22-heraklion-international-airport-n-kazantzakis']
          vil = data['visits']['2026-08-22-vilnius-airport']

          # A visit may use either numeric durationMinutes OR durationKind, never both.
          her['durationMinutes'] = 150
          her['durationKind'] = None

          # Arrival is an instantaneous finishing point, so use the semantic finish kind.
          vil['durationMinutes'] = None
          vil['durationKind'] = 'finish'

          payload = json.dumps(data, ensure_ascii=False, indent=2)
          path.write_text(text[:m.start(1)] + payload + text[m.end(1):], encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text, n = re.subn(r"const CACHE_VERSION = 'crete-2026-v(\d+)';", lambda x: f"const CACHE_VERSION = 'crete-2026-v{int(x.group(1))+1}';", sw_text, count=1)
          if n != 1:
              raise SystemExit('Could not bump cache version')
          sw.write_text(sw_text, encoding='utf-8')
          PY

      - name: Validate data and runtime contract
        run: |
          node --check itinerary-data.js
          node - <<'NODE'
          global.window = {};
          require('./itinerary-data.js');
          require('./data-validation.js');
          const result = window.CRETE_VALIDATION_API.validate(window.CRETE_DATA);
          if (!result.valid) {
            console.error(result.errors.join('\n'));
            process.exit(1);
          }
          console.log('CRETE_DATA validation OK');
          NODE
          if [ -f scripts/check-runtime-contract.mjs ]; then node scripts/check-runtime-contract.mjs; fi

      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/fix-return-flight-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-data.js service-worker.js .github/workflows/fix-return-flight-validation.yml
          git commit -m 'Fix Aug 22 return flight validation'
          git push
