  'мезе': 'mʲe.ˈzʲe',
  'сувлаки': 'su.ˈvla.kʲi',
  'мусака': 'mu.sa.ˈka',
  'мусаки': 'mu.sa.ˈkʲi',
  'карбонары': 'kar.bo.ˈna.rɨ',
  'кафенио': 'ka.fʲe.ˈnʲi.o',
  'панигири': 'pa.nʲi.ˈgʲi.rʲi',
  'Лаики': 'la.i.ˈkʲi',
  'Ираклион': 'i.ˈra.klʲi.on',
  'Сития': 'sʲi.ˈtʲi.ja',
  'Мохлос': 'ˈmox.los',
