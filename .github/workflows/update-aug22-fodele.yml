name: Update Aug 22 with Fodele lunch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-aug22-fodele.yml'

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update only 22 August
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, re
          from pathlib import Path

          path = Path('itinerary-data.js')
          text = path.read_text(encoding='utf-8')
          match = re.search(r'window\.CRETE_DATA = deepFreeze\((\{.*\})\);\s*\}\)\(\);\s*$', text, re.S)
          if not match:
              raise SystemExit('Could not locate CRETE_DATA payload')
          data = json.loads(match.group(1))
          days, places, visits, routes = data['days'], data['places'], data['visits'], data['routes']

          d = '2026-08-22'
          if days[d]['title'] != 'Расслабленное утро и вылет':
              raise SystemExit('22 August changed since planning; refusing to overwrite')

          # Remove only the previous Aug 22 visits / route.
          for key in list(visits):
              if key.startswith(d + '-'):
                  del visits[key]
          routes.pop('route-' + d, None)

          def place(pid, name, query, lat=None, lon=None):
              places[pid] = {
                  'id': pid,
                  'name': name,
                  'coordinates': {'lat': lat, 'lon': lon},
                  'navigationQuery': query,
                  'transportMode': 'driving',
              }

          place('fodele-village', 'Fodele', 'Fodele Village, Crete, Greece')
          place('litinos-fodele', 'Litinos', 'Litinos, Fodele, Crete, Greece')
          place('to-giasemi-fodele', 'Το Giasemi', 'Το Giasemi, Fodele, Crete, Greece')

          def visit(pid, seq, role, start, end=None, duration=None, status='standard', mode='driving', minutes=0, km=0, note='', duration_kind=None, suffix=None):
              vid = f'{d}-{suffix or pid}'
              visits[vid] = {
                  'id': vid,
                  'dayId': d,
                  'placeId': pid,
                  'sequence': seq,
                  'role': role,
                  'timing': {'start': start, 'end': end, 'approximate': True},
                  'durationMinutes': duration,
                  'inboundTravel': {
                      'mode': mode,
                      'durationMinutes': None if status == 'none' else minutes,
                      'distanceKm': None if status == 'none' else km,
                      'status': status,
                  },
                  'note': note,
                  'parking': {'primaryId': None, 'primaryOverrides': None, 'alternatives': []},
                  'map': {'visible': True},
                  'durationKind': duration_kind,
              }
              return vid

          ids = [
              visit('pomegranate-garden-villa', 0, 'Спокойное последнее утро и выезд', '08:00', '10:45', 165, status='none', note='Завтрак и расслабон; основные чемоданы собраны заранее. Checkout до 11:00.', duration_kind=None),
              visit('fodele-village', 1, 'Короткая остановка в деревне перед обедом', '11:40', '11:55', 15, minutes=55, km=55, note='Небольшая прогулка без экскурсионной программы.'),
              visit('litinos-fodele', 2, 'Последний критский обед', '11:55', '12:55', 60, minutes=5, km=1, note='Основной вариант — Litinos. План Б: Το Giasemi, если Litinos не подойдёт или будет занят.'),
              visit('gomega-car-rentals-heraklion', 3, 'Возврат автомобиля', '13:40', '13:55', 15, minutes=45, km=35, note='По текущему ваучеру Rental End — 14:00. Не планировать возврат позже без письменного подтверждения GoMega.'),
              visit('heraklion-international-airport-n-kazantzakis', 4, 'Шаттл, регистрация и вылет в Vilnius', '14:05', None, None, mode='rental-shuttle', minutes=10, km=2, note='Рейс HN 2322 в 17:55; после возврата машины остаётся большой запас времени.', duration_kind='airport'),
          ]

          days[d] = {
              'id': d,
              'title': 'Fodele, последний критский обед и вылет',
              'status': 'confirmed',
              'visitIds': ids,
              'routeId': 'route-' + d,
              'sections': {
                  'essentials': {'items': [
                      'Утро оставить спокойным: завтрак и расслабон без больших сборов.',
                      'После checkout заехать в Fodele на короткую прогулку и последний критский обед.',
                      'Основной ресторан — Litinos; план Б — Το Giasemi.',
                      'Автомобиль вернуть до 14:00 по текущему ваучеру; рейс HN 2322 вылетает в 17:55.'
                  ]},
                  'food': {'items': [
                      'Нормальный завтрак дома.',
                      'Обед в Litinos в Fodele; Το Giasemi — запасной вариант.',
                      'После возврата машины при необходимости только напиток или лёгкий перекус в аэропорту.'
                  ]},
                  'practical': {'items': [
                      'Checkout из Pomegranate Garden Villa — до 11:00.',
                      'По ваучеру GoMega Rental End — 14:00, поэтому ориентир прибытия около 13:40–13:45.',
                      'Если GoMega письменно согласует возврат позже, можно сдвинуть Fodele и обед без изменения общей логики дня.',
                      'Перед выездом проверить документы, ручную кладь, холодильник и зарядки.'
                  ]}
              },
              'mealSummary': 'завтрак дома; обед в Litinos (план Б — Το Giasemi)',
              'schedule': {
                  'departure': {'start': '10:45', 'end': None, 'approximate': True},
                  'finish': None,
                  'carReturnDeadline': '14:00',
                  'flight': {'number': 'HN 2322', 'departureTime': '17:55'}
              },
              'travelTotals': {'drivingDurationMinutes': 100, 'distanceKm': 93, 'approximate': True},
              'swimming': None,
          }
          routes['route-' + d] = {'id': 'route-' + d, 'dayId': d, 'visitIds': ids}

          payload = json.dumps(data, ensure_ascii=False, indent=2)
          path.write_text(text[:match.start(1)] + payload + text[match.end(1):], encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text, count = re.subn(r"const CACHE_VERSION = 'crete-2026-v(\d+)';", lambda m: f"const CACHE_VERSION = 'crete-2026-v{int(m.group(1)) + 1}';", sw_text, count=1)
          if count != 1:
              raise SystemExit('Could not bump service worker cache')
          sw.write_text(sw_text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check itinerary-data.js
          node - <<'NODE'
          global.window = {};
          require('./itinerary-data.js');
          require('./data-validation.js');
          const result = window.CRETE_VALIDATION_API.validate(window.CRETE_DATA);
          if (!result.valid) {
            console.error(result.errors.join('\n'));
            process.exit(1);
          }
          console.log('Validated Aug 22 update');
          NODE

      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/update-aug22-fodele.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-data.js service-worker.js .github/workflows/update-aug22-fodele.yml
          git commit -m 'Add Fodele lunch to Aug 22'
          git push
