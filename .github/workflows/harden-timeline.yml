name: Harden timeline bounds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-timeline.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Clamp timeline segments to visible day span
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app-runtime.js')
          s = p.read_text(encoding='utf-8')
          old = """      const offsetStart = (seg.clockStart - startMinutes) / totalMinutes * 100;\n      const offsetEnd = (seg.clockEnd - startMinutes) / totalMinutes * 100;\n      const width = offsetEnd - offsetStart;\n"""
          new = """      const visibleStart = Math.max(seg.clockStart, startMinutes);\n      const visibleEnd = Math.min(seg.clockEnd, maxEndTime);\n      if (visibleEnd <= visibleStart) return '';\n      const offsetStart = (visibleStart - startMinutes) / totalMinutes * 100;\n      const offsetEnd = (visibleEnd - startMinutes) / totalMinutes * 100;\n      const width = Math.max(0, offsetEnd - offsetStart);\n"""
          if old not in s:
              raise SystemExit('timeline positioning block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          sw = Path('service-worker.js')
          t = sw.read_text(encoding='utf-8')
          import re
          t, n = re.subn(r"const CACHE_VERSION = 'crete-2026-v(\d+)';", lambda m: f"const CACHE_VERSION = 'crete-2026-v{int(m.group(1))+1}';", t, count=1)
          if n != 1:
              raise SystemExit('cache version not found')
          sw.write_text(t, encoding='utf-8')
          PY
          node --check app-runtime.js
      - name: Commit
        run: |
          rm .github/workflows/harden-timeline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-runtime.js service-worker.js .github/workflows/harden-timeline.yml
          git commit -m 'Harden timeline bounds'
          git push
