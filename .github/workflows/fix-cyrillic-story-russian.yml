            ('аркхаеологикал сите мусеум', 'археологический музей'),
          ]
          changed = 0
          for old, new in replacements:
              if old in s:
                  count = s.count(old)
                  s = s.replace(old, new)
                  changed += count
          path.write_text(s, encoding='utf-8')
          print(f'Applied {changed} Russian-language corrections')
          PY

      - name: Validate narration and itinerary
        run: |
          node --check stories-data.js
          node scripts/check-audio-source-contract.mjs
          node scripts/validate-itinerary.mjs
          node scripts/check-runtime-contract.mjs

      - name: Commit polished stories
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-cyrillic-story-russian.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stories-data.js .github/workflows/fix-cyrillic-story-russian.yml
          git commit -m 'Polish Russian grammar in story narration'
          git push
