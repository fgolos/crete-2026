name: Apply runtime cleanup

on:
  push:
    branches:
      - feature/normalized-itinerary-data
    paths:
      - '.github/workflows/apply-runtime-cleanup.yml'
      - 'scripts/apply-runtime-cleanup.mjs'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/normalized-itinerary-data
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply cleanup
        run: node scripts/apply-runtime-cleanup.mjs
      - name: Validate syntax and data
        run: |
          node --check itinerary-data.js
          node --check itinerary-bootstrap.js
          node --check app-runtime.js
          node --check service-worker.js
          node --check scripts/validate-itinerary.mjs
          node scripts/validate-itinerary.mjs
          node scripts/check-runtime-contract.mjs
      - name: Remove one-time automation
        run: |
          rm scripts/apply-runtime-cleanup.mjs
          rm .github/workflows/apply-runtime-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-runtime.js itinerary-data.js itinerary-bootstrap.js service-worker.js scripts/validate-itinerary.mjs scripts/apply-runtime-cleanup.mjs .github/workflows/apply-runtime-cleanup.yml
          git commit -m 'chore: remove legacy runtime cleanup tails'
          git push origin HEAD:feature/normalized-itinerary-data
