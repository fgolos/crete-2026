name: Apply West logistics fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-west-logistics-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch itinerary data
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('itinerary-data.js')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          def replace_in_segment(start_marker, end_marker, old, new, label):
              global s
              start = s.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker not found')
              end = s.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f'{label}: end marker not found')
              segment = s[start:end]
              count = segment.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match in segment, found {count}')
              segment = segment.replace(old, new, 1)
              s = s[:start] + segment + s[end:]

          # GoMega: contract now runs until 16:00; planned arrival remains 15:00.
          replace_once(
              '"returnDeadline": "2026-08-22T15:00:00+03:00"',
              '"returnDeadline": "2026-08-22T16:00:00+03:00"',
              'car rental deadline'
          )

          day16_start = '    "2026-08-16": {'
          day16_end = '    "2026-08-17": {'
          replace_in_segment(
              day16_start, day16_end,
              '"Если покупок немного и не жарко — вернуться в Platanes пешком вдоль пляжа."',
              '"После Rethymno возвращаемся в Platanes автобусом; если ждать неудобно — taxi."',
              'day16 essentials transport'
          )
          replace_in_segment(
              day16_start, day16_end,
              '"Пеший возврат зависит от жары, ветра и количества покупок."',
              '"Не планируем 6 км пешком после Rethymno: автобус — основной вариант, taxi — запасной."',
              'day16 practical transport'
          )

          visit16_start = '    "2026-08-16-platanes-beach": {'
          visit16_end = '    "2026-08-16-pomegranate-garden-villa-end": {'
          replace_in_segment(visit16_start, visit16_end,
              '"role": "Пляж и возможный пеший возврат вдоль моря"',
              '"role": "Пляж после возвращения из Rethymno"',
              'day16 beach role')
          replace_in_segment(visit16_start, visit16_end,
              '"mode": "walking",\n        "durationMinutes": 75,\n        "distanceKm": 6,',
              '"mode": "transit",\n        "durationMinutes": 25,\n        "distanceKm": 7,',
              'day16 inbound transport')
          replace_in_segment(visit16_start, visit16_end,
              '"note": "Пешком только если не накупили тележку сувениров."',
              '"note": "Из Rethymno возвращаемся автобусом; если ожидание неудобное — taxi. Плановый старт пляжа остаётся 17:30."',
              'day16 beach note')

          # Wednesday Organic Farmers' Market: arrive/park 10:45; market itself starts at 11:00.
          day19_start = '    "2026-08-19": {'
          day19_end = '    "2026-08-20": {'
          replace_in_segment(
              day19_start, day19_end,
              '"Решение продолжать ли после рынка на Akrotiri принимаем на месте по настроению, погоде и покупкам."',
              '"В 10:45 приезжаем к Parking 4 Martires; сам Organic Farmers’ Market начинается в 11:00.",\n            "Решение продолжать ли после рынка на Akrotiri принимаем на месте по настроению, погоде и покупкам."',
              'day19 parking note'
          )

          visit19_start = '    "2026-08-19-organic-farmers-market-rethymno": {'
          visit19_end = '    "2026-08-19-stavros-beach": {'
          replace_in_segment(visit19_start, visit19_end,
              '"start": "10:45",\n        "end": "11:45",',
              '"start": "11:00",\n        "end": "11:45",',
              'day19 market timing')
          replace_in_segment(visit19_start, visit19_end,
              '"durationMinutes": 60,',
              '"durationMinutes": 45,',
              'day19 market duration')
          replace_in_segment(visit19_start, visit19_end,
              '"note": "Рынок желательный. После него по настроению можно отменить дальнюю часть дня, вернуться домой и тюленить на Platanes Beach."',
              '"note": "Приехать к Parking 4 Martires примерно в 10:45, припарковаться и дойти до рынка; торговля начинается в 11:00. После рынка по настроению можно отменить дальнюю часть дня и вернуться на Platanes Beach."',
              'day19 market note')
          replace_in_segment(visit19_start, visit19_end,
              '"primaryId": null,',
              '"primaryId": "rethymno-4-martires",',
              'day19 market parking')

          # Thursday Laiki: Parking 4 Martires is occupied by the market, use Old Town parking.
          day20_start = '    "2026-08-20": {'
          day20_end = '    "2026-08-21": {'
          replace_in_segment(
              day20_start, day20_end,
              '"Margarites и Arkadi Monastery исключены: семья уже была."',
              '"Основная парковка для Laiki — StS - Old Town Parking; Parking 4 Martires в четверг занят самим рынком.",\n            "Одежду и другие термостойкие покупки можно оставить в багажнике, но продукты и оливковое масло не оставляем в раскалённой машине.",\n            "Margarites и Arkadi Monastery исключены: семья уже была."',
              'day20 practical parking'
          )

          visit20_start = '    "2026-08-20-laiki-market-rethymno": {'
          visit20_end = '    "2026-08-20-eleftherna": {'
          replace_in_segment(visit20_start, visit20_end,
              '"note": "Приехать пораньше на машине; майки и оливковое масло смогут ждать в машине."',
              '"note": "Приехать пораньше и оставить машину в StS - Old Town Parking. Одежду и термостойкие покупки можно оставить в багажнике; продукты и оливковое масло в жаркой машине не оставлять."',
              'day20 market note')
          replace_in_segment(visit20_start, visit20_end,
              '"primaryId": null,',
              '"primaryId": "rethymno-old-town-parking-sts",',
              'day20 market parking')

          # Add the two Rethymno parking entities once.
          if '"rethymno-4-martires": {' in s or '"rethymno-old-town-parking-sts": {' in s:
              raise SystemExit('Rethymno market parking entities already exist unexpectedly')
          parking_anchor = '  "parkingLocations": {\n'
          parking_insert = '''  "parkingLocations": {\n    "rethymno-4-martires": {\n      "id": "rethymno-4-martires",\n      "name": "Parking 4 Martires",\n      "coordinates": {\n        "lat": 35.36615,\n        "lon": 24.47453\n      },\n      "navigationQuery": "35.36615,24.47453",\n      "category": "municipal",\n      "payment": {\n        "type": "paid"\n      },\n      "reliability": "high",\n      "walking": {\n        "durationMinutes": 4\n      },\n      "status": "recommended",\n      "summary": "Основная парковка для Wednesday Organic Farmers’ Market у Municipal Garden.",\n      "priceNote": "Платная; актуальный тариф проверить при въезде.",\n      "crowdingNote": "В среду к открытию рынка может заполняться; приехать примерно к 10:45.",\n      "notes": [\n        {\n          "type": "general",\n          "text": "Подходит для Organic Farmers’ Market в среду."\n        },\n        {\n          "type": "general",\n          "text": "В четверг эту парковку занимает Laiki Market, поэтому для Thursday Laiki её не использовать."\n        }\n      ],\n      "verification": {\n        "date": "2026-08-07",\n        "source": "manual"\n      }\n    },\n    "rethymno-old-town-parking-sts": {\n      "id": "rethymno-old-town-parking-sts",\n      "name": "StS - Old Town Parking",\n      "coordinates": {\n        "lat": 35.3711,\n        "lon": 24.4735\n      },\n      "navigationQuery": "Ioannou Melissinou 17, Rethymno 741 31, Greece",\n      "category": "private",\n      "payment": {\n        "type": "paid"\n      },\n      "reliability": "medium",\n      "walking": {\n        "durationMinutes": 10\n      },\n      "status": "recommended",\n      "summary": "Основная парковка для Thursday Laiki, когда Parking 4 Martires занят рынком.",\n      "priceNote": "Платная; актуальный тариф проверить на месте.",\n      "crowdingNote": "В четверг утром возможна повышенная загрузка из-за Laiki; приезжаем рано.",\n      "notes": [\n        {\n          "type": "general",\n          "text": "После парковки идти пешком к Laiki у Municipal Garden."\n        },\n        {\n          "type": "general",\n          "text": "Если парковка заполнена, не кружить вокруг рынка: использовать резервную парковку западнее/у Marina по ситуации."\n        }\n      ],\n      "verification": {\n        "date": "2026-08-07",\n        "source": "manual"\n      }\n    },\n'''
          if s.count(parking_anchor) != 1:
              raise SystemExit(f'parking anchor: expected 1, found {s.count(parking_anchor)}')
          s = s.replace(parking_anchor, parking_insert, 1)

          # Aug 22: plan arrival at GoMega 15:00, contract deadline 16:00.
          day22_start = '    "2026-08-22": {'
          day22_end = '  },\n  "places": {'
          replace_in_segment(day22_start, day22_end,
              '"В 15:00 вернуть автомобиль в GoMega; рейс HN 2322 вылетает в 17:55."',
              '"Планируем прибыть в GoMega к 15:00; контракт аренды продлён до 16:00. Рейс HN 2322 вылетает в 17:55."',
              'day22 essentials rental')
          replace_in_segment(day22_start, day22_end,
              '"GoMega подтвердили продление аренды до 15:00."',
              '"GoMega подтвердили продление аренды до 16:00; плановое прибытие на возврат — 15:00."',
              'day22 practical rental')
          replace_in_segment(day22_start, day22_end,
              '"carReturnDeadline": "15:00"',
              '"carReturnDeadline": "16:00"',
              'day22 schedule deadline')

          visit22_start = '    "2026-08-22-gomega-car-rentals-heraklion": {'
          visit22_end = '    "2026-08-22-heraklion-international-airport-n-kazantzakis": {'
          replace_in_segment(visit22_start, visit22_end,
              '"note": "Возврат автомобиля в подтверждённое GoMega время — 15:00."',
              '"note": "Планируем прибыть в GoMega к 15:00. Контракт аренды продлён до 16:00, поэтому остаётся часовой запас до договорного срока возврата."',
              'day22 GoMega visit note')

          path.write_text(s, encoding='utf-8')

          sw = Path('service-worker.js')
          sws = sw.read_text(encoding='utf-8')
          if "const CACHE_VERSION = 'crete-2026-v38';" not in sws:
              raise SystemExit('Expected service-worker cache v38')
          sw.write_text(sws.replace("const CACHE_VERSION = 'crete-2026-v38';", "const CACHE_VERSION = 'crete-2026-v39';", 1), encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check itinerary-data.js
          node scripts/validate-itinerary.mjs
          node scripts/check-runtime-contract.mjs

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-west-logistics-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix West itinerary logistics and market parking'
          git push origin main
