name: Validate itinerary

on:
  pull_request:
  push:
    branches:
      - refactor/native-normalized-renderer

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/native-normalized-renderer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete native renderer migration
        if: hashFiles('scripts/finish-native-renderer.mjs') != ''
        run: |
          node scripts/finish-native-renderer.mjs
          rm scripts/finish-native-renderer.mjs
          rm -f .github/workflows/finish-native-renderer.yml
          cat > .github/workflows/validate-itinerary.yml <<'YAML'
          name: Validate itinerary

          on:
            pull_request:
            push:
              branches:
                - refactor/native-normalized-renderer
                - main

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Check JavaScript syntax
                  run: |
                    node --check itinerary-data.js
                    node --check itinerary-model.js
                    node --check itinerary-renderer-model.js
                    node --check formatters.js
                    node --check data-validation.js
                    node --check itinerary-bootstrap.js
                    node --check app.js
                    node --check app-runtime.js
                    node --check stories-data.js
                    node --check service-worker.js
                - name: Validate normalized itinerary
                  run: node scripts/validate-itinerary.mjs
                - name: Check native renderer contract
                  run: node scripts/check-runtime-contract.mjs
          YAML
      - name: Check JavaScript syntax
        run: |
          node --check itinerary-data.js
          node --check itinerary-model.js
          node --check itinerary-renderer-model.js
          node --check formatters.js
          node --check data-validation.js
          node --check itinerary-bootstrap.js
          node --check app.js
          node --check app-runtime.js
          node --check stories-data.js
          node --check service-worker.js
      - name: Validate normalized itinerary
        run: node scripts/validate-itinerary.mjs
      - name: Check native renderer contract
        run: node scripts/check-runtime-contract.mjs
      - name: Commit completed migration
        if: hashFiles('scripts/finish-native-renderer.mjs') == ''
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: complete native normalized renderer'
          git push origin HEAD:refactor/native-normalized-renderer
