name: Update Platanes destination data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-platanes-destination.yml

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update final stop
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('itinerary-data.js')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'\{"order":4,"name":"Platanes","role":"Заселение и отдых","time":"≈15:15","duration":"Финиш","drive":"2 ч 20–40 мин","distance":"≈125–135 км","note":"В навигации заменить на точный адрес жилья\.","lat":35\.36763,"lon":24\.52633,"navigationQuery":"35\.36763,24\.52633","mapVisible":true\}')
          replacement = '{"order":4,"name":"Pomegranate Garden Villa","role":"Заселение и отдых","time":"≈15:15","duration":"Финиш","drive":"2 ч 20–40 мин","distance":"≈125–135 км","note":"Airbnb в Platanes: Lasithiou 4, Rethymno 741 50, Greece.","lat":35.36763,"lon":24.52633,"navigationQuery":"Lasithiou 4, Rethymno 741 50, Greece","mapVisible":true}'
          updated, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'Expected one final-stop match, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit updated itinerary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itinerary-data.js
          git commit -m "Set Pomegranate Garden Villa as final destination"
          git push
