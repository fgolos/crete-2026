name: Fix point 0 times for Aug 21-22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-point0-times.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update point 0 display times
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, re
          from pathlib import Path

          path = Path('itinerary-data.js')
          text = path.read_text(encoding='utf-8')
          match = re.search(r'window\.CRETE_DATA = deepFreeze\((\{.*\})\);\s*\}\)\(\);\s*$', text, re.S)
          if not match:
              raise SystemExit('Could not locate CRETE_DATA payload')
          data = json.loads(match.group(1))

          v21 = data['visits']['2026-08-21-pomegranate-garden-villa-start']
          v21['timing']['start'] = '09:00'
          v21['timing']['end'] = None
          v21['durationMinutes'] = None
          v21['durationKind'] = 'start'
          data['days']['2026-08-21']['schedule']['departure'] = {'start':'09:00','end':None,'approximate':False}

          v22 = data['visits']['2026-08-22-pomegranate-garden-villa']
          v22['timing']['start'] = '11:00'
          v22['timing']['end'] = None
          v22['durationMinutes'] = None
          v22['durationKind'] = 'start'
          data['days']['2026-08-22']['schedule']['departure'] = {'start':'11:00','end':None,'approximate':False}

          payload = json.dumps(data, ensure_ascii=False, indent=2)
          path.write_text(text[:match.start(1)] + payload + text[match.end(1):], encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text, count = re.subn(r"const CACHE_VERSION = 'crete-2026-v(\d+)';", lambda m: f"const CACHE_VERSION = 'crete-2026-v{int(m.group(1)) + 1}';", sw_text, count=1)
          if count != 1:
              raise SystemExit('Could not bump cache version')
          sw.write_text(sw_text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check itinerary-data.js
          node - <<'NODE'
          global.window = {};
          require('./itinerary-data.js');
          require('./data-validation.js');
          const result = window.CRETE_VALIDATION_API.validate(window.CRETE_DATA);
          if (!result.valid) {
            console.error(result.errors.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Commit and remove workflow
        run: |
          rm .github/workflows/fix-point0-times.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-data.js service-worker.js .github/workflows/fix-point0-times.yml
          git commit -m 'Fix Aug 21-22 point 0 times'
          git push
