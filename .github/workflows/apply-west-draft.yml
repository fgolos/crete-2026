        stop(3, 'Panormo', 'Поздний обед, деревня и купание', '14:20–18:00', '3 ч 40 мин', '35 мин', '25 км', 'Главная спокойная остановка второй половины дня.', 35.4173, 24.6912, 'Panormo, Rethymno, Greece'),
