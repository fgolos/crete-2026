name: Support compact drive times

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/support-compact-drive-times.yml

permissions:
  contents: write

jobs:
  update-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add H:MM parsing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          old = """  function parseTimeToMinutes(timeStr) {
    if (!timeStr || timeStr === '—' || timeStr === '-') return 0;
    let minutes = 0;
"""
          new = """  function parseTimeToMinutes(timeStr) {
    if (!timeStr || timeStr === '—' || timeStr === '-') return 0;
    const compactMatch = timeStr.match(/^(\\d+):(\\d{2})$/);
    if (compactMatch) return Number(compactMatch[1]) * 60 + Number(compactMatch[2]);
    let minutes = 0;
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one parser target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit parser support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Support compact drive times in timeline"
          git push