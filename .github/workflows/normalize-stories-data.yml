name: Normalize stories data

on:
  push:
    paths:
      - 'scripts/normalize-stories-data.mjs'
      - '.github/workflows/normalize-stories-data.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/normalize-stories-data.mjs
      - name: Commit normalized file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories-data.js
          git diff --cached --quiet || git commit -m "Normalize story constants"
          git push
