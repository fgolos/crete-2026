  const data = window.CRETE_ITINERARY;
  if (!data) return;

  const VILLA = {
    name: 'Pomegranate Garden Villa',
    lat: 35.36855713304881,
    lon: 24.530239843450914,
    navigationQuery: 'Lasithiou 4, Rethymno 741 50, Greece',
    mapVisible: true
  };
  const villaStop = (order, role, time, duration, drive, distance, note) => ({
    order, ...VILLA, role, time, duration, drive, distance, note
  });
  const stop = (order, name, role, time, duration, drive, distance, note, lat, lon, navigationQuery = name) => ({
    order, name, role, time, duration, drive, distance, note, lat, lon, navigationQuery, mapVisible: true
  });
  const section = (title, items) => ({ title, items });
  const day = (id, date, title, meta, stops, essentials, food, practical, routeStopOrders, mealSummary) => ({
    id, short: `${id.replace('day', '')} Aug`, date, title, meta, stops,
    sections: {
      essentials: section('Главное и гибкость', essentials),
      food: section('Питание', food),
      practical: section('Практические заметки', practical)
    },
    routeStopOrders, mealSummary
  });

  const westPart = data.parts?.find(part => part.id === 'west');
  if (westPart) {
    westPart.description = 'Черновой каркас по варианту 1: спокойный старт, Chania, деревни, южное побережье, Falassarna и гибкий резервный день. Детали будут уточнены после семейного обсуждения.';
  }

  const draftDays = [
    day(
      'day16', '16 августа, воскресенье', 'Rethymno и спокойный день у моря',
