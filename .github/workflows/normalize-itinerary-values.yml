name: Normalize itinerary values

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-itinerary-values.yml

permissions:
  contents: write

jobs:
  normalize-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Normalize driving times and distances
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import math
          import re

          path = Path('itinerary-data.js')
          text = path.read_text(encoding='utf-8')
          prefix = 'window.CRETE_ITINERARY='
          suffix = ';'
          if not text.startswith(prefix) or not text.endswith(suffix):
              raise SystemExit('Unexpected itinerary-data.js format')

          data = json.loads(text[len(prefix):-len(suffix)])

          def strip_approx(value):
              if isinstance(value, str):
                  return value.replace('≈', '')
              if isinstance(value, list):
                  return [strip_approx(item) for item in value]
              if isinstance(value, dict):
                  return {key: strip_approx(item) for key, item in value.items()}
              return value

          def round_up_to_five(value):
              return int(math.ceil(value / 5) * 5)

          def format_clock(minutes):
              return f'{minutes // 60}:{minutes % 60:02d}'

          def normalize_drive(label):
              label = label.replace('≈', '').strip()
              if label in {'—', '-'}:
                  return '—'

              match = re.fullmatch(r'(\d+)\s*ч\s*(\d+)\s*мин\s*[–—-]\s*(\d+)\s*ч', label, re.I)
              if match:
                  start = int(match.group(1)) * 60 + int(match.group(2))
                  end = int(match.group(3)) * 60
                  return format_clock(round_up_to_five((start + end) / 2))

              match = re.fullmatch(r'(\d+)\s*ч\s*(\d+)\s*[–—-]\s*(\d+)\s*мин', label, re.I)
              if match:
                  hours = int(match.group(1)) * 60
                  start = hours + int(match.group(2))
                  end = hours + int(match.group(3))
                  return format_clock(round_up_to_five((start + end) / 2))

              match = re.fullmatch(r'(\d+)\s*[–—-]\s*(\d+)\s*мин', label, re.I)
              if match:
                  start, end = map(int, match.groups())
                  return format_clock(round_up_to_five((start + end) / 2))

              match = re.fullmatch(r'(\d+)\s*ч(?:\s*(\d+)\s*мин)?', label, re.I)
              if match:
                  minutes = int(match.group(1)) * 60 + int(match.group(2) or 0)
                  return format_clock(round_up_to_five(minutes))

              match = re.fullmatch(r'(\d+)\s*мин', label, re.I)
              if match:
                  return format_clock(round_up_to_five(int(match.group(1))))

              raise SystemExit(f'Unrecognized drive value: {label!r}')

          def normalize_distance(label):
              label = label.replace('≈', '').strip()
              if label in {'—', '-'}:
                  return '—'

              match = re.fullmatch(r'(\d+)\s*[–—-]\s*(\d+)\s*км', label, re.I)
              if match:
                  start, end = map(int, match.groups())
                  return f'{round((start + end) / 2)}км'

              match = re.fullmatch(r'(\d+)\s*км', label, re.I)
              if match:
                  return f'{int(match.group(1))}км'

              raise SystemExit(f'Unrecognized distance value: {label!r}')

          data = strip_approx(data)
          for day in data['days']:
              for stop in day['stops']:
                  stop['drive'] = normalize_drive(stop['drive'])
                  stop['distance'] = normalize_distance(stop['distance'])

          path.write_text(prefix + json.dumps(data, ensure_ascii=False, separators=(',', ':')) + suffix, encoding='utf-8')
          PY
      - name: Commit normalized itinerary data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itinerary-data.js
          git commit -m "Compact itinerary travel values"
          git push