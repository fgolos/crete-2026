name: Cancel stale Pages deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-pages.yml'

permissions:
  contents: read
  pages: write

jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale deployment for 4b02a14e
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOYMENT_ID: 4b02a14e9e5628880da53152b05a555895172cdc
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/pages/deployments/${DEPLOYMENT_ID}/cancel")

          if [ "$status" = '204' ] || [ "$status" = '404' ]; then
            echo "Stale Pages deployment is cancelled or no longer present (HTTP ${status})."
            exit 0
          fi

          cat response.json
          echo "Unexpected HTTP status: ${status}"
          exit 1
