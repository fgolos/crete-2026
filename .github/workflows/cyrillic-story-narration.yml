name: Normalize story narration to Cyrillic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cyrillic-story-narration.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Convert narratable story text to Cyrillic
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, re
          from pathlib import Path

          path = Path('stories-data.js')
          source = path.read_text(encoding='utf-8')
          prefix = 'window.CRETE_STORIES = '
          if not source.startswith(prefix) or not source.rstrip().endswith(';'):
              raise SystemExit('Unexpected stories-data.js wrapper')
          stories = json.loads(source[len(prefix):].rstrip()[:-1])

          # Ordered: grammar/context-sensitive phrases first, then proper names and terms.
          replacements = [
              ('между более крупными Chania и Candia', 'между более крупными городами Ханья и Кандия'),
              ('по мере приближения к Chania', 'по мере приближения к Ханье'),
              ('Из Chania в Marathi', 'Из Ханьи в Марати'),
              ('из Chania в Marathi', 'из Ханьи в Марати'),
              ('из Platanes в Amari', 'из Платанеса в Амари'),
              ('Из Platanes в Amari', 'Из Платанеса в Амари'),
              ('Из Gerakari в Platanes', 'Из Геракари в Платанес'),
              ('из Gerakari в Platanes', 'из Геракари в Платанес'),
              ('Из Platanes в Fodele', 'Из Платанеса в Фоделе'),
              ('из Platanes в Fodele', 'из Платанеса в Фоделе'),
              ('в Meronas', 'в Меронасе'),
              ('к Eleutherna', 'к Элефтерне'),
              ('в Eleutherna', 'в Элефтерне'),
              ('в Stavros', 'в Ставросе'),
              ('в Fodele', 'в Фоделе'),
              ('к Fodele', 'к Фоделе'),
              ('на склонах Mount Kedros', 'на склонах горы Кедрос'),
              ('под Mount Kedros', 'под горой Кедрос'),
              ('с IX до VII–VI веков', 'с девятого до седьмого-шестого веков'),
              ('во второй половине XIII или начале XIV века', 'во второй половине тринадцатого или начале четырнадцатого века'),
              ('от позднего IV тысячелетия', 'от позднего четвёртого тысячелетия'),
              ('XIII века', 'тринадцатого века'),
              ('XIV века', 'четырнадцатого века'),
              ('Wednesday Organic Farmers’ Market', 'органический фермерский рынок по средам'),
              ('Wednesday Organic Farmers\' Market', 'органический фермерский рынок по средам'),
              ('Thursday Laiki', 'рынок Лаики по четвергам'),
              ('Organic Farmers’ Market', 'органический фермерский рынок'),
              ('Organic Farmers\' Market', 'органический фермерский рынок'),
              ('Organic Market', 'Органический рынок'),
              ('Museum of Ancient Eleutherna', 'музей древней Элефтерны'),
              ('Domenikos Theotokopoulos Museum', 'музей Доменикоса Теотокопулоса'),
              ('Historical Museum of Crete', 'Исторический музей Крита'),
              ('National Gallery of Art', 'Национальная галерея искусства'),
              ('Museo del Greco', 'музей Эль Греко'),
              ('Psiloritis UNESCO Global Geopark', 'глобальный геопарк Псилоритис ЮНЕСКО'),
              ('UNESCO Global Geopark', 'глобальный геопарк ЮНЕСКО'),
              ('Amari Valley', 'долина Амари'),
              ('Platis River', 'река Платис'),
              ('Mount Kedros', 'гора Кедрос'),
              ('Mount Samitos', 'гора Самитос'),
              ('White Mountains', 'Белые горы'),
              ('Cretan Sea', 'Критское море'),
              ('Souda Bay', 'бухта Суда'),
              ('Rimondi Fountain', 'фонтан Римонди'),
              ('Venetian Loggia', 'Венецианская лоджия'),
              ('Zorba the Greek', 'Грек Зорба'),
              ('Michael Cacoyannis', 'Михалис Какояннис'),
              ('Nikos Kazantzakis', 'Никос Казандзакис'),
              ('Anthony Quinn', 'Энтони Куинн'),
              ('Kouzina EPE', 'Кузина Э П Э'),
              ('Homemade Food', 'домашняя еда'),
              ('cooked dishes', 'готовые блюда'),
              ('stuffed vegetables', 'фаршированные овощи'),
              ('martyred villages', 'деревень-мучениц'),
              ('Homer in Crete', 'Гомер на Крите'),
              ('Caretta caretta', 'каретта каретта'),
              ('Koumoundourou Street', 'улица Кумундуроу'),
              ('Municipal Garden', 'муниципальный сад'),
              ('Old Town', 'старый город'),
              ('Fortezza', 'Фортецца'),
              ('ARCHELON', 'АРХЕЛОН'),
              ('UNESCO', 'ЮНЕСКО'),
              ('Instagram', 'Инстаграм'),
              ('Domenikos Theotokopoulos', 'Доменикос Теотокопулос'),
              ('El Greco', 'Эль Греко'),
              ('Panagia Kera', 'Панагия Кера'),
              ('Agios Georgios', 'Айос Георгиос'),
              ('Agios Nikolaos', 'Айос Николаос'),
              ('Agia Sophia', 'Айя София'),
              ('Agia Anna', 'Айя Анна'),
              ('Orthi Petra', 'Орти Петра'),
              ('Nefs Amari', 'Нефс Амари'),
              ('Apostoloi', 'Апостоли'),
              ('Opsigias', 'Опсигьяс'),
              ('Monastiraki', 'Монастираки'),
              ('Gerakari', 'Геракари'),
              ('Meronas', 'Меронас'),
              ('Elenes', 'Эленес'),
              ('Psiloritis', 'Псилоритис'),
              ('Samitos', 'Самитос'),
              ('Kedros', 'Кедрос'),
              ('Kallergis', 'Каллергис'),
              ('Panagia', 'Панагия'),
              ('Fabrika', 'Фабрика'),
              ('kafeneio', 'кафенио'),
              ('mageirio', 'магирио'),
              ('Akrotiri', 'Акротири'),
              ('Stavros', 'Ставрос'),
              ('Marathi', 'Марати'),
              ('Splantzia', 'Спландзья'),
              ('Eleutherna', 'Элефтерна'),
              ('Panormo', 'Панормо'),
              ('meltemi', 'мельтеми'),
              ('Korakas', 'Коракас'),
              ('Fodele', 'Фоделе'),
              ('Malevizi', 'Малевизи'),
              ('Toledo', 'Толедо'),
              ('Venice', 'Венеция'),
              ('Rome', 'Рим'),
              ('Candia', 'Кандия'),
              ('Heraklion', 'Ираклион'),
              ('Rethymno', 'Ретимно'),
              ('Chania', 'Ханья'),
              ('Platanes Beach', 'пляж Платанес'),
              ('Platanes', 'Платанес'),
              ('Amari', 'Амари'),
              ('Cretan', 'критский'),
              ('Crete', 'Крит'),
              ('Laiki Market', 'рынок Лаики'),
              ('Laiki', 'Лаики'),
              ('Wednesday', 'среда'),
              ('Thursday', 'четверг'),
              ('greens', 'зелень'),
              ('souvlaki', 'сувлаки'),
              ('moussaka', 'мусака'),
              ('carbonara', 'карбонара'),
              ('meze', 'мезе'),
              ('antikristo', 'антикристо'),
              ('tsigariasto', 'цигарьясто'),
              ('gamopilafo', 'гамопилафо'),
              ('stew', 'тушёное блюдо'),
              ('raki', 'раки'),
              ('panigiri', 'панигири'),
              ('Panigiri', 'Панигири'),
              ('Litinos', 'Литинос'),
          ]

          # Very small phonetic safety net. It should only catch isolated proper-name leftovers;
          # normal English phrases belong in the explicit replacements above.
          translit = {
              'a':'а','b':'б','c':'к','d':'д','e':'е','f':'ф','g':'г','h':'х','i':'и','j':'дж',
              'k':'к','l':'л','m':'м','n':'н','o':'о','p':'п','q':'к','r':'р','s':'с','t':'т',
              'u':'у','v':'в','w':'в','x':'кс','y':'й','z':'з'
          }

          def transform(value):
              if not isinstance(value, str):
                  return value
              result = value
              for old, new in replacements:
                  result = result.replace(old, new)
              leftovers = re.findall(r'[A-Za-z]+', result)
              for word in sorted(set(leftovers), key=len, reverse=True):
                  repl = ''.join(translit.get(ch.lower(), ch) for ch in word)
                  if word[:1].isupper():
                      repl = repl[:1].upper() + repl[1:]
                  result = re.sub(rf'\b{re.escape(word)}\b', repl, result)
              return result

          narration_fields = ('buttonLabel', 'title')
          for story in stories:
              for field in narration_fields:
                  if isinstance(story.get(field), str):
                      story[field] = transform(story[field])
              for field in ('text', 'lookFor'):
                  if isinstance(story.get(field), list):
                      story[field] = [transform(item) for item in story[field]]
              narration = story.get('narration')
              if isinstance(narration, dict) and isinstance(narration.get('blocks'), list):
                  narration['blocks'] = [transform(item) for item in narration['blocks']]

          # This is the actual contract we care about: nothing sent to Azure may contain Latin letters.
          failures = []
          for story in stories:
              checks = []
              checks.append(('buttonLabel', story.get('buttonLabel')))
              checks.append(('title', story.get('title')))
              for i, item in enumerate(story.get('text') or []): checks.append((f'text[{i}]', item))
              for i, item in enumerate(story.get('lookFor') or []): checks.append((f'lookFor[{i}]', item))
              for i, item in enumerate((story.get('narration') or {}).get('blocks') or []): checks.append((f'narration.blocks[{i}]', item))
              for field, value in checks:
                  if isinstance(value, str) and re.search(r'[A-Za-z]', value):
                      failures.append(f"{story.get('id')} {field}: {value}")
          if failures:
              raise SystemExit('Latin letters remain in narratable story text:\n' + '\n'.join(failures))

          path.write_text(prefix + json.dumps(stories, ensure_ascii=False, indent=2) + ';\n', encoding='utf-8')
          print(f'Normalized {len(stories)} stories; all narratable fields are Cyrillic-only.')
          PY

      - name: Enforce Cyrillic narration contract permanently
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/check-audio-source-contract.mjs')
          s = path.read_text(encoding='utf-8')
          marker = "if (!stories.length) throw new Error('No stories were loaded');\n"
          if 'Latin letters in narratable field' not in s:
              block = r'''const LATIN = /[A-Za-z]/;
          function narrationStrings(story) {
            return [
              ['buttonLabel', story.buttonLabel],
              ['title', story.title],
              ...(story.text || []).map((value, index) => [`text[${index}]`, value]),
              ...(story.lookFor || []).map((value, index) => [`lookFor[${index}]`, value]),
              ...((story.narration?.blocks || []).map((value, index) => [`narration.blocks[${index}]`, value]))
            ];
          }

          for (const story of stories) {
            for (const [field, value] of narrationStrings(story)) {
              if (typeof value === 'string' && LATIN.test(value)) {
                throw new Error(`Latin letters in narratable field ${story.id}.${field}: ${value}`);
              }
            }
          }

          '''
              if marker not in s:
                  raise SystemExit('Audio contract insertion marker not found')
              s = s.replace(marker, marker + block, 1)
              path.write_text(s, encoding='utf-8')
          PY

      - name: Bump offline cache
        shell: bash
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path
          path = Path('service-worker.js')
          s = path.read_text(encoding='utf-8')
          m = re.search(r"const CACHE_VERSION = 'crete-2026-v(\d+)';", s)
          if not m:
              raise SystemExit('CACHE_VERSION not found')
          n = int(m.group(1)) + 1
          s = s[:m.start()] + f"const CACHE_VERSION = 'crete-2026-v{n}';" + s[m.end():]
          path.write_text(s, encoding='utf-8')
          print(f'Cache bumped to v{n}')
          PY

      - name: Validate
        run: |
          node --check stories-data.js
          node --check scripts/check-audio-source-contract.mjs
          node scripts/check-audio-source-contract.mjs
          node scripts/validate-itinerary.mjs
          node scripts/check-runtime-contract.mjs

      - name: Commit normalized stories
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cyrillic-story-narration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stories-data.js scripts/check-audio-source-contract.mjs service-worker.js .github/workflows/cyrillic-story-narration.yml
          git commit -m 'Normalize story narration to Cyrillic'
          git push
