name: Update west itinerary once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-west-itinerary.yml'

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update itinerary data
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, re
          from pathlib import Path

          path = Path('itinerary-data.js')
          text = path.read_text(encoding='utf-8')
          match = re.search(r'window\.CRETE_DATA = deepFreeze\((\{.*\})\);\s*\}\)\(\);\s*$', text, re.S)
          if not match:
              raise SystemExit('Could not locate CRETE_DATA payload')
          data = json.loads(match.group(1))

          days = data['days']
          places = data['places']
          visits = data['visits']
          routes = data['routes']

          expected = {
              '2026-08-15': 'Kazarma Fortress, Lastros и переезд в Platanes',
              '2026-08-17': 'Chania и Marathi',
              '2026-08-18': 'Margarites, Eleftherna и Panormo',
              '2026-08-19': 'Plakias и южное побережье',
              '2026-08-20': 'Falassarna',
              '2026-08-21': 'Lake Kournas и Georgioupoli',
          }
          for day_id, title in expected.items():
              if days.get(day_id, {}).get('title') != title:
                  raise SystemExit(f'{day_id} changed since planning; refusing to overwrite current main')

          def place(pid, name, query=None, mode='driving', lat=None, lon=None):
              places[pid] = {
                  'id': pid,
                  'name': name,
                  'coordinates': {'lat': lat, 'lon': lon},
                  'navigationQuery': query or name,
                  'transportMode': mode,
              }

          def visit(day, pid, seq, role, start, end=None, duration=None,
                    travel_status='standard', travel_mode='driving', travel_minutes=0,
                    distance=0, note='', visible=True, duration_kind=None, suffix=None):
              vid = f'{day}-{suffix or pid}'
              visits[vid] = {
                  'id': vid,
                  'dayId': day,
                  'placeId': pid,
                  'sequence': seq,
                  'role': role,
                  'timing': {'start': start, 'end': end, 'approximate': True},
                  'durationMinutes': duration,
                  'inboundTravel': {
                      'mode': travel_mode,
                      'durationMinutes': None if travel_status == 'none' else travel_minutes,
                      'distanceKm': None if travel_status == 'none' else distance,
                      'status': travel_status,
                  },
                  'note': note,
                  'parking': {'primaryId': None, 'primaryOverrides': None, 'alternatives': []},
                  'map': {'visible': visible},
                  'durationKind': duration_kind,
              }
              return vid

          def set_day(day, title, visit_ids, essentials, food, practical,
                      meal, depart, finish, drive_min, km, swimming=None, status='confirmed'):
              days[day] = {
                  'id': day,
                  'title': title,
                  'status': status,
                  'visitIds': visit_ids,
                  'routeId': f'route-{day}',
                  'sections': {
                      'essentials': {'items': essentials},
                      'food': {'items': food},
                      'practical': {'items': practical},
                  },
                  'mealSummary': meal,
                  'schedule': {
                      'departure': {'start': depart, 'end': None, 'approximate': True},
                      'finish': {'start': finish, 'end': None, 'approximate': True} if finish else None,
                      'carReturnDeadline': None,
                      'flight': None,
                  },
                  'travelTotals': {
                      'drivingDurationMinutes': drive_min,
                      'distanceKm': km,
                      'approximate': True,
                  },
                  'swimming': swimming,
              }
              routes[f'route-{day}'] = {'id': f'route-{day}', 'dayId': day, 'visitIds': visit_ids}

          def append_unique(items, value):
              if value not in items:
                  items.append(value)

          # Remove only the old western drafts for 16–21 August. 15 August morning is agreed East Crete
          # and must stay intact; 22 August logistics are also preserved and only annotated below.
          for key in list(visits):
              if any(key.startswith(f'2026-08-{d:02d}-') for d in range(16, 22)):
                  del visits[key]
          for d in range(16, 22):
              routes.pop(f'route-2026-08-{d:02d}', None)

          # Remove places that belonged only to discarded draft routes.
          for obsolete in [
              'margarites', 'plakias', 'falassarna-beach', 'lake-kournas',
              'georgioupoli', 'chania-old-town-and-venetian-port'
          ]:
              places.pop(obsolete, None)

          # New / retained western places.
          place('panigiri-village-tbd', 'Panigiri — деревня уточняется', 'Rethymno panigiri 15 August 2026')
          place('organic-farmers-market-rethymno', 'Organic Farmers’ Market Rethymno', 'Koumoundourou Street, Rethymno, Greece', lat=35.3660, lon=24.4710)
          place('laiki-market-rethymno', 'Laiki Market Rethymno', 'Municipal Garden, Rethymno, Greece', lat=35.3660, lon=24.4718)
          place('eleftherna', 'Eleutherna Archaeological Museum', 'Museum of Ancient Eleutherna, Crete, Greece', lat=35.3246, lon=24.6754)
          place('stavros-beach', 'Stavros Beach', 'Stavros Beach, Akrotiri, Crete, Greece', lat=35.5914, lon=24.0955)
          place('kouzina-epe', 'Kouzina EPE', 'Kouzina EPE, Chania, Greece')
          place('marathi-beach', 'Marathi Beach', 'Marathi Beach, Crete, Greece', lat=35.5057, lon=24.1691)
          place('apostoloi-amari', 'Apostoloi', 'Apostoloi, Amari, Crete, Greece', lat=35.25455, lon=24.62762)
          place('nefs-amari', 'Nefs Amari', 'Nefs Amari, Crete, Greece', lat=35.23333, lon=24.65000)
          place('opsigias', 'Opsigias', 'Opsigias, Amari, Crete, Greece', lat=35.22732, lon=24.65987)
          place('monastiraki-amari', 'Monastiraki', 'Monastiraki, Amari, Crete, Greece', lat=35.22788, lon=24.66781)
          place('meronas', 'Meronas', 'Meronas, Amari, Crete, Greece', lat=35.23379, lon=24.62920)
          place('elenes', 'Elenes', 'Elenes, Amari, Crete, Greece', lat=35.21980, lon=24.61411)
          place('gerakari', 'Gerakari', 'Gerakari, Amari, Crete, Greece', lat=35.21422, lon=24.60925)

          # 15 August: preserve the already agreed morning / transfer and append only the evening panigiri.
          d = '2026-08-15'
          old_ids = [vid for vid in days[d]['visitIds'] if vid != f'{d}-panigiri-village-tbd']
          visits.pop(f'{d}-panigiri-village-tbd', None)
          seq = max(visits[vid]['sequence'] for vid in old_ids) + 1
          panigiri_id = visit(
              d, 'panigiri-village-tbd', seq, 'Традиционный критский panigiri', '21:00', None, None,
              travel_minutes=30, distance=20,
              note='Конкретную деревню, парковку и необходимость бронирования стола уточнить ближе к дате. Вечерний пробег пока ориентировочный.',
              visible=False, duration_kind='finish'
          )
          days[d]['visitIds'] = old_ids + [panigiri_id]
          routes[days[d]['routeId']]['visitIds'] = days[d]['visitIds']
          days[d]['title'] = 'Kazarma, Lastros, переезд в Platanes и panigiri'
          append_unique(days[d]['sections']['essentials']['items'], 'Вечером — традиционный критский panigiri; конкретную деревню выберем ближе к дате.')
          append_unique(days[d]['sections']['food']['items'], 'На panigiri рассчитываем на деревенский ужин; перед выездом достаточно лёгкого перекуса.')
          append_unique(days[d]['sections']['practical']['items'], 'После заселения оставить несколько часов на отдых перед вечерним panigiri.')
          append_unique(days[d]['sections']['practical']['items'], 'Водитель не пьёт раки; точную афишу и парковку перепроверить за несколько дней.')
          days[d]['mealSummary'] = days[d]['mealSummary'] + '; ужин на panigiri'
          days[d]['schedule']['finish'] = {'start': '23:59', 'end': None, 'approximate': True}
          days[d]['travelTotals']['approximate'] = True

          # 16 August: late start, familiar Rethymno, beach, optional walk home.
          d = '2026-08-16'
          ids = [
              visit(d, 'pomegranate-garden-villa', 0, 'Позднее спокойное начало', '12:00', None, None, 'none', travel_mode='walking', note='После panigiri никаких ранних подвигов.', duration_kind='start', suffix='pomegranate-garden-villa-start'),
              visit(d, 'rethymno-old-town-and-venetian-harbour', 1, 'Обед и неспешный Rethymno', '13:00', '17:00', 240, travel_mode='transit', travel_minutes=25, distance=7, note='Лучше приехать автобусом; без обязательных музеев и повторного туристического марафона.'),
              visit(d, 'platanes-beach', 2, 'Пляж и возможный пеший возврат вдоль моря', '17:30', '20:00', 150, travel_mode='walking', travel_minutes=75, distance=6, note='Пешком только если не накупили тележку сувениров.'),
              visit(d, 'pomegranate-garden-villa', 3, 'Свободный вечер', '20:05', None, None, travel_mode='walking', travel_minutes=5, distance=0.4, duration_kind='finish', suffix='pomegranate-garden-villa-end'),
          ]
          set_day(d, 'Поздний Rethymno и пляж', ids,
                  ['Начало дня около 12:00.', 'Rethymno — обед, знакомый город и море без гонки по достопримечательностям.', 'Если покупок немного и не жарко — вернуться в Platanes пешком вдоль пляжа.'],
                  ['Обед в Rethymno.', 'Ужин свободно возле жилья.'],
                  ['Логичнее ехать в город автобусом.', 'Керамические лавки можно посмотреть в Old Town вместо повторной поездки в Margarites.', 'Пеший возврат зависит от жары, ветра и количества покупок.'],
                  'обед в Rethymno; ужин у базы', '12:00', '20:05', 0, 0, 'Platanes Beach')

          # 17 August: protected beach day.
          d = '2026-08-17'
          ids = [
              visit(d, 'pomegranate-garden-villa', 0, 'Выход на пляж без машины', '09:15', None, None, 'none', travel_mode='walking', duration_kind='start', suffix='pomegranate-garden-villa-start'),
              visit(d, 'platanes-beach', 1, 'Полный пляжный день', '09:25', '19:00', 575, travel_mode='walking', travel_minutes=10, distance=0.7, note='Утром занять лежаки; никаких поездок и «маленьких остановок».'),
              visit(d, 'pomegranate-garden-villa', 2, 'Возвращение домой', '19:10', None, None, travel_mode='walking', travel_minutes=10, distance=0.7, duration_kind='finish', suffix='pomegranate-garden-villa-end'),
          ]
          set_day(d, 'Полный пляжный день №1', ids,
                  ['Весь день провести на пляже возле Airbnb.', 'Без машины, экскурсий и дополнительных задач.', 'Это один из двух защищённых пляжных дней.'],
                  ['Обед и напитки — на пляже или рядом.', 'Ужин после возвращения домой.'],
                  ['Утром занять лежаки.', 'Если у Platanes красный флаг, южный маршрут через Sellia → Kato Rodakino → Korakas Beach остаётся только погодным запасным вариантом, а не экскурсией ради галочки.'],
                  'обед на пляже; ужин у базы', '09:15', '19:10', 0, 0, 'Platanes Beach')

          # 18 August: authentic Amari villages.
          d = '2026-08-18'
          specs = [
              ('pomegranate-garden-villa', 'Выезд из Platanes', '09:30', None, None, 0, 0, 'none', 'pomegranate-garden-villa-start'),
              ('apostoloi-amari', 'Первая деревенская остановка', '10:30', '11:10', 40, 60, 45, 'standard', None),
              ('nefs-amari', 'Кафенио и знакомство с долиной Amari', '11:25', '12:05', 40, 15, 7, 'standard', None),
              ('opsigias', 'Короткая остановка без формальной программы', '12:10', '12:35', 25, 5, 2, 'standard', None),
              ('monastiraki-amari', 'Деревня и поиск локальных продуктов', '12:45', '13:20', 35, 10, 4, 'standard', None),
              ('meronas', 'Главная остановка и обед', '13:35', '15:30', 115, 15, 6, 'standard', None),
              ('elenes', 'Небольшая деревенская пауза', '15:40', '16:10', 30, 10, 4, 'standard', None),
              ('gerakari', 'Финальная остановка: травы, раки, масло', '16:20', '17:20', 60, 10, 3, 'standard', None),
              ('pomegranate-garden-villa', 'Возвращение в Platanes', '18:15', None, None, 55, 38, 'standard', 'pomegranate-garden-villa-end'),
          ]
          ids = []
          for seq, (pid, role, start, end, duration, tmin, dist, status, suffix) in enumerate(specs):
              ids.append(visit(d, pid, seq, role, start, end, duration, status, travel_minutes=tmin, distance=dist,
                               note='Остановка гибкая: важнее атмосфера, открытое кафенио и разговоры, чем выполнение списка.',
                               duration_kind='start' if seq == 0 else ('finish' if seq == len(specs)-1 else None), suffix=suffix))
          set_day(d, 'Горные деревни Amari', ids,
                  ['Маршрут: Apostoloi → Nefs Amari → Opsigias → Monastiraki → Meronas → Elenes → Gerakari.', 'Цель — жилой, нетуристический Крит: кафенио, разговоры и небольшие деревенские остановки.', 'Ищем домашнее оливковое масло, раки, травы, мёд и другие локальные продукты.'],
                  ['Обед — в Meronas или другой деревне, где найдётся живое подходящее место.', 'Кофе и небольшие покупки — по ситуации, без жёстких броней.'],
                  ['Не ждать, что в каждой деревне будут магазины и производители открыты.', 'Маршрут по времени приблизительный; любую промежуточную деревню можно пропустить, если день начинает превращаться в чек-лист.'],
                  'деревенский обед; кофе и локальные продукты по пути', '09:30', '18:15', 180, 109, None)

          # 19 August: Organic Farmers’ Market is Plan A; Akrotiri is Plan B.
          d = '2026-08-19'
          ids = [
              visit(d, 'pomegranate-garden-villa', 0, 'Выезд на Organic Farmers’ Market', '10:30', None, None, 'none', duration_kind='start', suffix='pomegranate-garden-villa-start'),
              visit(d, 'organic-farmers-market-rethymno', 1, 'Свежие овощи, фрукты и местные продукты', '11:00', '12:15', 75, travel_minutes=20, distance=7, note='Рынок желательный, но не обязательный.'),
              visit(d, 'pomegranate-garden-villa', 2, 'Сразу вернуть свежие покупки домой', '12:35', None, None, travel_minutes=20, distance=7, note='После рынка — холодильник и полный расслабон.', duration_kind='finish', suffix='pomegranate-garden-villa-end'),
          ]
          set_day(d, 'Organic Farmers’ Market или Akrotiri', ids,
                  ['План A: Organic Farmers’ Market, затем сразу домой со свежими покупками.', 'План Б, если рынок пропускаем: Stavros Beach → обязательный обед в Kouzina EPE → Marathi Beach.', 'Akrotiri остаётся потенциальным дальним днём, а не обязанностью.'],
                  ['После рынка — обед и отдых у базы.', 'При плане Б обед в Kouzina EPE обязателен.'],
                  ['Решение между рынком и Akrotiri принять по настроению и погоде.', 'Akrotiri — примерно 175–180 км и около четырёх часов транспортного времени.', 'Не пытаться совместить Organic Farmers’ Market и Akrotiri в один день.'],
                  'план A: еда дома; план Б: Kouzina EPE', '10:30', '12:35', 40, 14, 'Platanes Beach после рынка; Marathi Beach при плане Б')

          # 20 August: obligatory Laiki, museum, optional Panormo, then start packing.
          d = '2026-08-20'
          ids = [
              visit(d, 'pomegranate-garden-villa', 0, 'Ранний выезд на Laiki', '07:45', None, None, 'none', duration_kind='start', suffix='pomegranate-garden-villa-start'),
              visit(d, 'laiki-market-rethymno', 1, 'Обязательный Laiki Market', '08:10', '10:10', 120, travel_minutes=25, distance=8, note='Приехать пораньше на машине; майки и оливковое масло смогут ждать в машине.'),
              visit(d, 'eleftherna', 2, 'Eleutherna Archaeological Museum', '11:00', '13:00', 120, travel_minutes=50, distance=30, note='Музей обязателен; во вторник он закрыт.'),
              visit(d, 'panormo', 3, 'Panormo по желанию', '13:35', '16:15', 160, travel_minutes=35, distance=25, note='Короткая прогулка, обед или купание. Если атмосфера не нравится — уехать без чувства долга.'),
              visit(d, 'pomegranate-garden-villa', 4, 'Возвращение и начало сборов', '16:45', None, None, travel_minutes=30, distance=22, note='Вечером начать собирать чемоданы.', duration_kind='finish', suffix='pomegranate-garden-villa-end'),
          ]
          set_day(d, 'Laiki, Eleutherna и Panormo по желанию', ids,
                  ['Laiki Market обязателен: приехать рано и оставить нескоропортящиеся покупки в машине.', 'Eleutherna Archaeological Museum — главная культурная остановка дня.', 'Panormo — только короткая необязательная проверка, не цель путешествия.'],
                  ['После Laiki можно ехать дальше без возвращения домой.', 'Обед — после музея или в Panormo по ситуации.'],
                  ['Margarites и Arkadi Monastery исключены: семья уже была.', 'Вечером начать сборы и убрать большую часть вещей.', 'Не оставлять упаковку чемоданов на 22 августа.'],
                  'обед после музея или в Panormo', '07:45', '16:45', 140, 85, 'Panormo по желанию')

          # 21 August: finish packing early, then the second protected beach day.
          d = '2026-08-21'
          ids = [
              visit(d, 'pomegranate-garden-villa', 0, 'Практически закончить сборы', '08:00', '09:00', 60, 'none', note='Оставить снаружи только купальные вещи, одежду на дорогу и необходимые мелочи.', suffix='pomegranate-garden-villa-start'),
              visit(d, 'platanes-beach', 1, 'Полный расслабленный день на пляже', '09:15', '19:00', 585, travel_mode='walking', travel_minutes=10, distance=0.7, note='После утренних сборов день полностью принадлежит пляжу.'),
              visit(d, 'pomegranate-garden-villa', 2, 'Последний спокойный вечер', '19:10', None, None, travel_mode='walking', travel_minutes=10, distance=0.7, duration_kind='finish', suffix='pomegranate-garden-villa-end'),
          ]
          set_day(d, 'Полный пляжный день №2', ids,
                  ['Утром практически закончить сборы.', 'После 09:00 — пляж возле Airbnb до вечера.', 'Без машины, поездок и переноса сюда несостоявшихся экскурсий.'],
                  ['Обед на пляже или рядом.', 'Последний ужин — спокойно возле жилья.'],
                  ['К вечеру 20 августа уже должна быть собрана основная часть вещей.', 'Оставить отдельную компактную сумку на последнее утро и дорогу.', 'При красном флаге южный Korakas Beach остаётся только погодным резервом.'],
                  'обед на пляже; последний ужин у базы', '08:00', '19:10', 0, 0, 'Platanes Beach')

          # 22 August: preserve return logistics; only make the morning explicitly relaxed.
          d = '2026-08-22'
          days[d]['title'] = 'Расслабленное утро и вылет'
          days[d]['status'] = 'confirmed'
          days[d]['sections'] = {
              'essentials': {'items': [
                  'Утро оставить спокойным: завтрак и расслабон без больших сборов.',
                  'Выезд из Platanes около 10:30–10:45.',
                  'Автомобиль вернуть до 14:00; рейс HN 2322 вылетает в 17:55.'
              ]},
              'food': {'items': [
                  'Нормальный завтрак дома.',
                  'Перекус после возврата машины или в аэропорту.'
              ]},
              'practical': {'items': [
                  'Основные сборы закончены утром 21 августа.',
                  'Перед выездом проверить только документы, ручную кладь, холодильник и зарядки.',
                  'Не планировать остановки и достопримечательности по пути в аэропорт.',
                  'Накануне уточнить у GoMega точную процедуру возврата.'
              ]}
          }
          days[d]['mealSummary'] = 'завтрак дома; перекус в аэропорту'

          payload = json.dumps(data, ensure_ascii=False, indent=2)
          path.write_text(text[:match.start(1)] + payload + text[match.end(1):], encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text, count = re.subn(
              r"const CACHE_VERSION = 'crete-2026-v(\d+)';",
              lambda m: f"const CACHE_VERSION = 'crete-2026-v{int(m.group(1)) + 1}';",
              sw_text,
              count=1
          )
          if count != 1:
              raise SystemExit('Could not bump service worker cache')
          sw.write_text(sw_text, encoding='utf-8')
          PY

      - name: Validate data
        shell: bash
        run: |
          set -euo pipefail
          node --check itinerary-data.js
          node - <<'NODE'
          global.window = {};
          require('./itinerary-data.js');
          require('./data-validation.js');
          const result = window.CRETE_VALIDATION_API.validate(window.CRETE_DATA);
          if (!result.valid) {
            console.error(result.errors.join('\n'));
            process.exit(1);
          }
          for (const day of ['2026-08-17','2026-08-18','2026-08-19','2026-08-20','2026-08-21']) {
            console.log(day, window.CRETE_DATA.days[day].title);
          }
          NODE
          git diff --check

      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/update-west-itinerary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-data.js service-worker.js .github/workflows/update-west-itinerary.yml
          git commit -m 'Update west Crete itinerary'
          git push

      - name: Dispatch Pages deployment for updated main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
