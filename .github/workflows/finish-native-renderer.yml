name: Finish native renderer

on:
  push:
    branches:
      - refactor/native-normalized-renderer
    paths:
      - '.github/workflows/finish-native-renderer.yml'
      - 'scripts/finish-native-renderer.mjs'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/native-normalized-renderer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply native renderer migration
        run: node scripts/finish-native-renderer.mjs
      - name: Update validation workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/validate-itinerary.yml')
          text = p.read_text()
          text = text.replace('      - feature/normalized-itinerary-data', '      - refactor/native-normalized-renderer')
          text = text.replace('          node --check itinerary-source.js\n', '')
          p.write_text(text)
          PY
      - name: Validate syntax and data
        run: |
          node --check itinerary-data.js
          node --check itinerary-model.js
          node --check itinerary-renderer-model.js
          node --check formatters.js
          node --check data-validation.js
          node --check itinerary-bootstrap.js
          node --check app.js
          node --check app-runtime.js
          node --check stories-data.js
          node --check service-worker.js
          node scripts/validate-itinerary.mjs
          node scripts/check-runtime-contract.mjs
      - name: Remove one-time migration assets
        run: |
          rm scripts/finish-native-renderer.mjs
          rm .github/workflows/finish-native-renderer.yml
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: complete native normalized renderer'
          git push origin HEAD:refactor/native-normalized-renderer
