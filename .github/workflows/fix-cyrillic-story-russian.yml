name: Polish Cyrillic story Russian

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cyrillic-story-russian.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix Russian grammar after Cyrillic normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
