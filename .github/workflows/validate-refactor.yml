name: Validate itinerary refactor

on:
  push:
    branches:
      - refactor-itinerary-parking
    paths:
      - .github/workflows/validate-refactor.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor-itinerary-parking
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate refactor
        run: node scripts/validate-refactor.mjs

      - name: Remove temporary validator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-off refactor validator"
          git push origin HEAD:refactor-itinerary-parking
