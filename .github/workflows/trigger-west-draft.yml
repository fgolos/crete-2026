name: Trigger West itinerary draft

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply-draft:
    if: github.event.issue.title == 'Apply West itinerary draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract and append draft itinerary
        shell: bash
        run: |
          if ! grep -q "WEST_DRAFT_VARIANT_1" itinerary-data.js; then
            awk '/^\/\/ WEST_DRAFT_VARIANT_1$/{copy=1} copy && /^WESTEOF$/{exit} copy{print}' .github/workflows/apply-west-draft.yml >> itinerary-data.js
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/apply-west-draft.yml .github/workflows/trigger-west-draft.yml
          git add itinerary-data.js
          git commit -m "Add draft West and Central Crete itinerary"
          git push origin HEAD:main

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Draft applied to main."
