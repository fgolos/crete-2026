name: Apply full-width swimming meta row

on:
  push:
    branches:
      - 'ui/meta-grid-road-first'
    paths:
      - '.github/workflows/apply-swimming-row.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/meta-grid-road-first
          fetch-depth: 0

      - name: Make swimming optional full-width meta row
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          runtime = Path('app-runtime.js')
          text = runtime.read_text(encoding='utf-8')
          old = "const coreMetaLabels = new Set(['дорога', 'время', 'купание']);"
          new = "const coreMetaLabels = new Set(['дорога', 'время']);"
          if text.count(old) != 1:
              raise SystemExit(f'app-runtime.js: expected one coreMetaLabels match, got {text.count(old)}')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          old_cache = "const CACHE_VERSION = 'crete-2026-v42';"
          new_cache = "const CACHE_VERSION = 'crete-2026-v43';"
          if sw_text.count(old_cache) != 1:
              raise SystemExit(f'service-worker.js: expected v42 once, got {sw_text.count(old_cache)}')
          sw.write_text(sw_text.replace(old_cache, new_cache, 1), encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check app-runtime.js
          node scripts/validate-itinerary.mjs
          node scripts/check-runtime-contract.mjs
          node scripts/check-audio-source-contract.mjs
          node scripts/smoke-browser.mjs

      - name: Commit clean patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-swimming-row.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-runtime.js service-worker.js .github/workflows/apply-swimming-row.yml
          git commit -m 'Make swimming meta row full width'
          git push origin HEAD:ui/meta-grid-road-first
