        { label: 'Выезд', value: 'около 10:30' },
        { label: 'Финиш', value: 'около 18:15' },
        { label: 'Вождение', value: 'около 50 мин' },
        { label: 'Расстояние', value: 'около 25 км' },
        { label: 'Купание', value: 'Platanes Beach' }
      ],
      [
        villaStop(0, 'Спокойное начало дня', '10:30', 'Старт', '—', '—', 'Без раннего подъёма после переезда.'),
        stop(1, 'Rethymno Old Town & Venetian Harbour', 'Прогулка, обед и первое знакомство с городом', '11:00–14:15', '3 ч 15 мин', '25 мин', '8 км', 'Короткая прогулка без задачи осмотреть весь старый город.', 35.36955, 24.47383, 'Rethymno Old Town, Greece'),
        stop(2, 'Platanes Beach', 'Отдых и купание рядом с базой', '15:00–18:00', '3 ч', '25 мин', '9 км', 'Главная цель второй половины дня — спокойно отдохнуть.', 35.3713, 24.5279, 'Platanes Beach, Rethymno, Greece'),
