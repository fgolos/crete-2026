name: Validate itinerary

on:
  pull_request:
  push:
    branches:
      - refactor/native-normalized-renderer
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check itinerary-data.js
          node --check itinerary-model.js
          node --check itinerary-renderer-model.js
          node --check formatters.js
          node --check data-validation.js
          node --check itinerary-bootstrap.js
          node --check app.js
          node --check app-runtime.js
          node --check stories-data.js
          node --check service-worker.js
          node --check scripts/generate-audio.mjs
          node --check scripts/validate-itinerary.mjs
          node --check scripts/check-runtime-contract.mjs
          node --check scripts/check-audio-source-contract.mjs
          node --check scripts/smoke-browser.mjs
          node --check scripts/report-data-hints.mjs
      - name: Report remaining presentation hints
        run: node scripts/report-data-hints.mjs
      - name: Validate normalized itinerary
        run: node scripts/validate-itinerary.mjs
      - name: Check native renderer contract
        run: node scripts/check-runtime-contract.mjs
      - name: Check audio source update contract
        run: node scripts/check-audio-source-contract.mjs
      - name: Smoke test rendered application
        run: node scripts/smoke-browser.mjs
