name: Apply story stress overrides

on:
  push:
    branches:
      - feature/story-stress-overrides
    paths:
      - '.github/workflows/apply-story-stress-overrides.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/story-stress-overrides
          fetch-depth: 0

      - name: Add phoneme support and audited stress overrides
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Curated stress overrides. Keys are exact spoken word forms; matching is case-insensitive.
          pron = Path('pronunciations-data.js')
          text = pron.read_text(encoding='utf-8').rstrip()
          if 'window.CRETE_PHONEMES' in text:
              raise SystemExit('CRETE_PHONEMES already exists')
          phonemes = r'''

window.CRETE_PHONEMES = {
  'храмовом': 'ˈxra.mə.vəm',
