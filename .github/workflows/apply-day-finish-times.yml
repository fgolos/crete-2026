name: Apply corrected day finish times

on:
  push:
    branches:
      - 'ui/meta-grid-road-first'
    paths:
      - '.github/workflows/apply-day-finish-times.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/meta-grid-road-first
          fetch-depth: 0

      - name: Correct day finish times
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('itinerary-data.js')
          text = path.read_text(encoding='utf-8')

          def replace_in_day(day_id, old, new):
              global text
              marker = f'    "{day_id}": {{'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'{day_id}: day block not found')
              next_day = text.find('\n    "2026-', start + len(marker))
              places = text.find('\n  },\n  "places": {', start + len(marker))
              candidates = [p for p in (next_day, places) if p >= 0]
              end = min(candidates) if candidates else len(text)
              block = text[start:end]
              if block.count(old) != 1:
                  raise SystemExit(f'{day_id}: expected one match for {old!r}, got {block.count(old)}')
              block = block.replace(old, new, 1)
              text = text[:start] + block + text[end:]

          replace_in_day(
              '2026-08-15',
              '"finish": {\n          "start": "23:59",\n          "end": null,\n          "approximate": false\n        }',
              '"finish": {\n          "start": "21:00",\n          "end": null,\n          "approximate": false\n        }'
          )
          replace_in_day(
              '2026-08-22',
              '"finish": null,',
              '"finish": {\n          "start": "21:20",\n          "end": null,\n          "approximate": false\n        },'
          )
          path.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          old_cache = "const CACHE_VERSION = 'crete-2026-v45';"
          new_cache = "const CACHE_VERSION = 'crete-2026-v46';"
          if sw_text.count(old_cache) != 1:
              raise SystemExit(f'service-worker.js: expected v45 once, got {sw_text.count(old_cache)}')
          sw.write_text(sw_text.replace(old_cache, new_cache, 1), encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check itinerary-data.js
          node --check app-runtime.js
          node scripts/validate-itinerary.mjs
          node scripts/check-runtime-contract.mjs
          node scripts/check-audio-source-contract.mjs
          node scripts/smoke-browser.mjs

      - name: Commit clean patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-day-finish-times.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-data.js service-worker.js .github/workflows/apply-day-finish-times.yml
          git commit -m 'Correct Aug 15 and Aug 22 finish times'
          git push origin HEAD:ui/meta-grid-road-first
