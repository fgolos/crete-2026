        stop(1, 'Plakias', 'Живописная дорога, обед, пляж и купание', '10:45–17:10', '6 ч 25 мин', '1 ч', '47 км', 'Один основной пляж без гонки между бухтами.', 35.1907, 24.3943, 'Plakias Beach, Crete, Greece'),
