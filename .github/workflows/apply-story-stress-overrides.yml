  'Айос': 'ˈa.jos',
  'Айя': 'ˈa.ja',
  'Николаос': 'nʲi.ˈko.la.os',
  'Георгиос': 'gʲe.ˈor.gʲi.os',
  'Гурния': 'gur.ˈnʲi.ja',
  'Топлу': 'to.ˈplu',
  'Хиона': 'xʲi.ˈo.na',
  'Палекастро': 'pa.ˈlʲe.ka.stro',
  'Итанос': 'ˈi.ta.nos',
  'Эримуполис': 'e.rʲi.ˈmu.po.lʲis',
  'Зирос': 'ˈzʲi.ros',
  'Ксерокамбос': 'kse.ˈro.kam.bos',
  'Закрос': 'ˈza.kros',
  'Казарма': 'kɐ.ˈzar.ma',
