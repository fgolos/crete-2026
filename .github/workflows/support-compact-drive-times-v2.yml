name: Support compact drive times v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/support-compact-drive-times-v2.yml

permissions:
  contents: write

jobs:
  update-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add H:MM parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r"(function parseTimeToMinutes\(timeStr\) \{\s*if \(!timeStr \|\| timeStr === '—' \|\| timeStr === '-'\) return 0;\s*)")
          replacement = r"\1const compactMatch = timeStr.match(/^(\\d+):(\\d{2})$/);\n    if (compactMatch) return Number(compactMatch[1]) * 60 + Number(compactMatch[2]);\n    "
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one parser target, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit parser support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Support compact drive times in timeline"
          git push