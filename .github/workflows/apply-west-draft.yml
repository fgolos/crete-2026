name: Apply West itinerary draft

on:
  push:
    paths:
      - .github/workflows/apply-west-draft.yml

permissions:
  contents: write

jobs:
  apply-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append draft itinerary and clean up
        shell: bash
        run: |
          if ! grep -q "WEST_DRAFT_VARIANT_1" itinerary-data.js; then
          cat >> itinerary-data.js <<'WESTEOF'

// WEST_DRAFT_VARIANT_1
